<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style></head><body><title>Терезе Кампус</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&display=swap">
<style>
/* Layout: a service desk. Left rail for navigation, a working column of numbered tickets, documents shown as real paper. */
:root{
  --bg:#F5F6F8; --surface:#FFFFFF; --sunk:#ECEEF2; --line:#E2E5EB;
  --ink:#1F2733; --muted:#667080;
  --accent:#3A62B8; --accent-ink:#FFFFFF; --accent-soft:#EAEFF9;
  --sun:#3A62B8; --sun-ink:#FFFFFF;
  --work:#3A62B8; --work-soft:#EAEFF9;
  --good:#2C7A57; --good-soft:#E7F3ED;
  --warn:#A65A2A; --warn-soft:#F8EEE6;
  --paper:#FFFFFF; --paper-ink:#1F2733; --paper-muted:#667080; --stamp:#3A62B8;
  --display:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body)}
h1,h2,h3,p,ol,ul{margin:0;padding:0}
ol,ul{list-style:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:28px;padding-block:24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;background:var(--surface);border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:11px}
.mark{width:34px;height:34px;display:grid;grid-template:1fr 1fr/1fr 1fr;gap:3px;flex:none}
.mark i{background:var(--accent);border-radius:2px}.mark i:nth-child(2){background:var(--sun)}
.brand b{font:600 16px/1.1 var(--display)}
.brand small{display:block;font:500 11px/1.3 var(--body);color:var(--muted);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav button{display:flex;align-items:center;gap:11px;padding:10px 11px;border-radius:7px;font-weight:500;text-align:left;color:var(--muted)}
.nav button:hover{background:var(--sunk);color:var(--ink)}
.nav button.on{background:var(--accent-soft);color:var(--ink);font-weight:600}
.nav svg{width:19px;height:19px;flex:none}
.count{margin-left:auto;font:600 12px var(--mono);background:var(--sun);color:var(--sun-ink);padding:0 7px;border-radius:9px}
.who{margin-top:auto;font-size:13px;line-height:1.4;padding-top:14px;border-top:1px solid var(--line)}
.who b{display:block;font-weight:600}.who span{color:var(--muted)}
.main{padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:940px;margin-inline:auto;display:flex;flex-direction:column;gap:26px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.note{font-size:12.5px;color:var(--muted);flex:1 1 220px;min-width:0}
.seg{display:inline-flex;background:var(--sunk);padding:3px;border-radius:8px}
.seg button{padding:6px 13px;border-radius:6px;font-size:13.5px;font-weight:500;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600}
.bell{position:relative;width:38px;height:38px;display:grid;place-items:center;border-radius:8px;background:var(--surface);border:1px solid var(--line)}
.bell svg{width:19px;height:19px}
.bell em{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;font:600 11px/19px var(--mono);text-align:center;background:var(--sun);color:var(--sun-ink);border-radius:10px;padding-inline:3px}
.popwrap{position:relative}
.pop{position:absolute;right:0;top:46px;width:min(340px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 36px rgba(6,30,30,.2);z-index:20;overflow:hidden}
.pop h3{font-size:13px;font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line)}
.pop button{display:block;width:100%;text-align:left;padding:11px 14px;font-size:13.5px;border-bottom:1px solid var(--line)}
.pop button:last-child{border-bottom:0}.pop button:hover{background:var(--sunk)}
.pop time,.muted{color:var(--muted);font-size:12.5px}.pop time{display:block;margin-top:2px}
.pop p{padding:16px 14px;color:var(--muted);font-size:13.5px}
h1{font:600 clamp(22px,3vw,27px)/1.25 var(--display);letter-spacing:-.01em;text-wrap:balance}
h2{font-size:17px;font-weight:600;line-height:1.3;text-wrap:balance}
.lead{color:var(--muted);max-width:62ch;margin-top:7px}
.sec{display:flex;flex-direction:column;gap:12px}
.sechead{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.link{color:var(--accent);font-weight:600;font-size:14px}
.link:hover{text-decoration:underline}
.search{position:relative;margin-top:16px}
.search svg{position:absolute;left:15px;top:15px;width:20px;height:20px;color:var(--muted)}
.search input{width:100%;padding:13px 15px 13px 45px;font-size:16px;background:var(--surface);border:1.5px solid var(--line);border-radius:9px}
.search input:focus{outline:0;border-color:var(--accent)}
.ticket{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px 18px;width:100%;text-align:left;padding:16px 18px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
button.ticket:hover{border-color:var(--accent)}
.ticket .full{grid-column:1/-1}
.num{font:600 12.5px var(--mono);color:var(--muted);letter-spacing:.01em}
.ticket h3{font-size:16px;font-weight:600;margin-top:2px}
.pill{align-self:start;font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
.p-work{background:var(--work-soft);color:var(--work)}.p-good{background:var(--good-soft);color:var(--good)}.p-warn{background:var(--warn-soft);color:var(--warn)}
.tr{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.tr li{position:relative;padding-top:18px;font-size:12.5px;color:var(--muted);min-width:0}
.tr li::before{content:"";position:absolute;top:4px;left:0;width:11px;height:11px;border-radius:50%;background:var(--surface);border:2px solid var(--line);z-index:1}
.tr li::after{content:"";position:absolute;top:8.5px;left:0;right:0;height:2px;background:var(--line)}
.tr li:last-child::after{display:none}
.tr li.d::before{background:var(--accent);border-color:var(--accent)}
.tr li.d::after{background:var(--accent)}
.tr li.c{color:var(--ink);font-weight:600}
.tr li.c::after{background:var(--line)}
.tr time{display:block;font-size:11.5px;font-weight:400;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.svc{display:flex;flex-direction:column;gap:5px;padding:14px 16px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:9px}
.svc:hover{border-color:var(--accent)}
.svc b{font-weight:600;line-height:1.3}
.svc span{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{padding:6px 12px;border-radius:16px;font-size:13.5px;font-weight:500;background:var(--surface);border:1px solid var(--line)}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:clamp(16px,3vw,24px);display:flex;flex-direction:column;gap:18px}
.steps{display:flex;gap:8px;font-size:13.5px;color:var(--muted);flex-wrap:wrap}
.steps b{color:var(--ink);font-weight:600}
.auto{background:var(--accent-soft);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:8px 16px}
.auto h3{grid-column:1/-1;font-size:13px;font-weight:600}
.kv span{display:block;font-size:12px;color:var(--muted)}.kv b{font-weight:600;overflow-wrap:anywhere}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-weight:600;font-size:14px}
.field input,.field select,.field textarea{padding:10px 12px;background:var(--bg);border:1.5px solid var(--line);border-radius:7px;width:100%}
.field textarea{min-height:90px;resize:vertical}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--warn)}
.err{color:var(--warn);font-size:13px}
.review{display:flex;flex-direction:column}
.review div{display:grid;grid-template-columns:minmax(0,190px) minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.review div:last-child{border-bottom:0}.review dt{color:var(--muted)}.review dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.btn{padding:11px 18px;border-radius:8px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn:hover{filter:brightness(1.08)}
.btn.alt{background:transparent;color:var(--ink);border:1.5px solid var(--line);padding:9.5px 16px}
.btn.alt:hover{border-color:var(--ink);filter:none}
.back{align-self:flex-start;color:var(--muted);font-size:14px;font-weight:500}
.back:hover{color:var(--ink)}
.banner{padding:12px 14px;border-radius:8px;font-size:14px}
.b-warn{background:var(--warn-soft)}.b-good{background:var(--good-soft)}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--line);padding:clamp(20px,5vw,46px);max-width:640px;width:100%;margin-inline:auto;box-shadow:0 8px 28px rgba(6,30,30,.14);display:flex;flex-direction:column;gap:18px;position:relative;font-size:14.5px}
.paper header{text-align:center;display:flex;flex-direction:column;gap:2px;font-size:13px;color:var(--paper-muted)}
.paper h2{font:600 19px/1.3 var(--display);color:var(--paper-ink);margin-top:14px}
.paper p{line-height:1.65}
.foot{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.qr{width:104px;height:104px;background:#fff}.qr svg{width:100%;height:100%;display:block}
.qrcap{font:400 11px/1.35 var(--mono);color:var(--paper-muted);overflow-wrap:anywhere;max-width:150px;margin-top:6px}
.stamp{width:108px;height:108px;border:3px double var(--stamp);border-radius:50%;display:grid;place-items:center;text-align:center;color:var(--stamp);font:600 10.5px/1.25 var(--body);transform:rotate(-9deg);padding:10px;flex:none}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:12px 14px}
.stat b{display:block;font:600 24px/1.2 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.inline{display:flex;gap:9px;flex-wrap:wrap}
.inline input{flex:1 1 200px;min-width:0;padding:11px 13px;background:var(--bg);border:1.5px solid var(--line);border-radius:7px;font-family:var(--mono)}
.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:9px;font-size:14px;font-weight:500;z-index:40;max-width:calc(100vw - 32px);box-shadow:0 10px 30px rgba(0,0,0,.28)}
.empty{padding:22px;text-align:center;color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:10px}
@media (max-width:780px){
  .shell{display:block}
  .rail{position:fixed;inset:auto 0 0 0;top:auto;height:auto;flex-direction:row;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-right:0;border-top:1px solid var(--line);z-index:30}
  .brand,.who{display:none}
  .nav{flex-direction:row;flex:1;justify-content:space-around;gap:0}
  .nav button{flex:1 1 0;min-width:0;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;text-align:center;position:relative}
  .count{position:absolute;top:0;right:12%;margin:0}
  .main{padding-block:14px 96px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .review div{grid-template-columns:1fr;gap:1px}
  .stats .stat{padding:10px}.stat b{font-size:20px}.stat span{font-size:12px}
}
@media (prefers-reduced-motion:no-preference){
  .view{animation:in .18s ease-out}
  @keyframes in{from{transform:translateY(5px)}to{transform:none}}
}
</style>

<div id="app"></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
const ic={
 home:'<path d="M3 11l9-7 9 7v9h-6v-6H9v6H3z"/>',
 grid:'<rect x="3" y="3" width="8" height="8"/><rect x="13" y="3" width="8" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/>',
 list:'<path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6"/>',
 check:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM8.5 12l2.5 2.5 4.5-5"/>',
 bell:'<path d="M6 10a6 6 0 0112 0c0 6 2 7 2 7H4s2-1 2-7zM10 20a2 2 0 004 0"/>',
 search:'<circle cx="11" cy="11" r="7"/><path d="M16.5 16.5L21 21"/>'
};
const svg=n=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ic[n]}</svg>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=h=>new Date(Date.now()-h*36e5);
const fmt=d=>d?d.toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const day=d=>d.toLocaleDateString('ru-RU',{day:'numeric',month:'long',year:'numeric'});

const ME={name:'Айгерим Сапарова',id:'240117',group:'SE-2507',prog:'Software Engineering',year:'2 курс'};
const STAGES=['Подана','В работе','Подписана','Готово'];
const CATS=['Справки','Учёба','Общежитие','Оплата','Обращения'];
const SEL=(k,l,o)=>({k,l,t:'select',o});
const TXT=(k,l,p)=>({k,l,t:'text',p});
const AREA=(k,l,p)=>({k,l,t:'area',p});
const SVCS=[
 {id:'study',cat:'Справки',n:'Справка с места учёбы',sla:'1 рабочий день',doc:true,f:[SEL('to','Куда предоставить',['Работодатель','Банк','Посольство','Центр занятости','Другая организация']),SEL('lang','Язык документа',['Русский','Қазақша','English'])]},
 {id:'trans',cat:'Справки',n:'Транскрипт оценок',sla:'2 рабочих дня',doc:true,f:[SEL('lang','Язык документа',['English','Русский','Қазақша'])]},
 {id:'card',cat:'Справки',n:'Перевыпуск студенческого билета',sla:'2 рабочих дня',f:[SEL('why','Причина',['Утерян','Повреждён','Смена фамилии'])]},
 {id:'retake',cat:'Учёба',n:'Заявление на пересдачу',sla:'2 рабочих дня',f:[TXT('course','Дисциплина','Например, Calculus 1'),AREA('why','Причина','Опишите коротко, почему нужна пересдача')]},
 {id:'leave',cat:'Учёба',n:'Академический отпуск',sla:'5 рабочих дней',f:[SEL('why','Основание',['По состоянию здоровья','Семейные обстоятельства','Служба в армии']),TXT('from','Дата начала','ДД.ММ.ГГГГ')]},
 {id:'dorm',cat:'Общежитие',n:'Заселение в общежитие',sla:'3 рабочих дня',f:[SEL('block','Желаемый корпус',['Корпус А','Корпус Б','Без разницы']),TXT('city','Город проживания','Например, Шымкент')]},
 {id:'fix',cat:'Общежитие',n:'Ремонт в комнате',sla:'1 рабочий день',f:[TXT('room','Номер комнаты','Например, А-412'),SEL('kind','Что сломалось',['Сантехника','Электрика','Мебель','Окна и двери']),AREA('why','Описание','Что именно нужно починить')]},
 {id:'bill',cat:'Оплата',n:'Квитанция на оплату обучения',sla:'В течение часа',f:[SEL('term','Семестр',['Весенний 2027','Осенний 2026'])]},
 {id:'plan',cat:'Оплата',n:'Рассрочка оплаты',sla:'3 рабочих дня',f:[SEL('parts','На сколько частей',['2 платежа','3 платежа','4 платежа']),AREA('why','Обоснование','Почему нужна рассрочка')]},
 {id:'ask',cat:'Обращения',n:'Обращение в деканат',sla:'2 рабочих дня',f:[TXT('topic','Тема','Коротко о вопросе'),AREA('why','Текст обращения','Опишите ситуацию')]}
];
const svc=id=>SVCS.find(s=>s.id===id);
const OTHER={name:'Данияр Ермеков',id:'250388',group:'CS-2503'};
const S={
 role:'student',view:'home',arg:null,cat:'Все',q:'',draft:null,errs:{},pop:false,verifyInput:'',verifyRes:null,
 seq:42,
 notes:[{t:'Транскрипт оценок готов',at:ago(50),id:'ZV-0031',read:true}],
 reqs:[
  {id:'ZV-0041',svc:'retake',who:OTHER,data:{'Дисциплина':'Physics 1','Причина':'Болезнь в период экзаменов, справка приложена'},stage:0,log:[ago(3),null,null,null]},
  {id:'ZV-0038',svc:'fix',who:ME,data:{'Номер комнаты':'А-412','Что сломалось':'Сантехника','Описание':'Подтекает кран в ванной'},stage:1,log:[ago(26),ago(20),null,null]},
  {id:'ZV-0031',svc:'trans',who:ME,data:{'Язык документа':'English'},stage:3,log:[ago(76),ago(70),ago(51),ago(50)]}
 ]
};
const find=id=>S.reqs.find(r=>r.id===id);
const mine=()=>S.reqs.filter(r=>r.who===ME);
const unread=()=>S.notes.filter(n=>!n.read).length;
const qCount=()=>S.reqs.filter(r=>r.stage<2&&!r.ret).length;
function pill(r){return r.ret?'<span class="pill p-warn">Нужно исправить</span>':r.stage===3?'<span class="pill p-good">Готово</span>':`<span class="pill p-work">${STAGES[r.stage]}</span>`}
function tracker(r){return `<ol class="tr">${STAGES.map((s,i)=>`<li class="${i<r.stage||r.stage===3?'d':i===r.stage?'c d':''}${i===r.stage?' c':''}">${s}<time>${fmt(r.log[i])}</time></li>`).join('')}</ol>`}
function ticket(r){return `<button class="ticket" data-go="detail" data-arg="${r.id}"><div><span class="num">${r.id}</span><h3>${esc(svc(r.svc).n)}</h3></div>${pill(r)}<div class="full">${tracker(r)}</div></button>`}
function card(s){return `<button class="svc" data-start="${s.id}"><b>${esc(s.n)}</b><span>${esc(s.cat)} · ${esc(s.sla)}</span></button>`}
function match(q){q=q.trim().toLowerCase();return q?SVCS.filter(s=>(s.n+' '+s.cat).toLowerCase().includes(q)):[]}
function searchRes(){const q=S.q.trim();if(!q)return '';const m=match(q);return m.length?`<div class="grid">${m.map(card).join('')}</div>`:`<p class="empty">По запросу «${esc(q)}» услуг нет. Попробуйте слово «справка» или «общежитие».</p>`}

const V={
home(){const act=mine().filter(r=>r.stage<3);const popular=['study','bill','fix'].map(svc);
 return `<div><h1>Здравствуйте, ${esc(ME.name.split(' ')[0])}</h1><p class="lead">Все услуги университета в одном окне. Подайте заявку онлайн и следите за её статусом.</p>
 <div class="search">${svg('search')}<input id="q" type="search" aria-label="Поиск услуги" placeholder="Какая услуга нужна? Например, справка" value="${esc(S.q)}"></div></div>
 <div id="res" class="sec">${searchRes()}</div>
 <section class="sec"><div class="sechead"><h2>Активные заявки</h2><button class="link" data-go="requests">Все заявки</button></div>${act.length?act.map(ticket).join(''):'<p class="empty">Активных заявок нет. Выберите услугу ниже.</p>'}</section>
 <section class="sec"><div class="sechead"><h2>Часто заказывают</h2><button class="link" data-go="services">Все услуги</button></div><div class="grid">${popular.map(card).join('')}</div></section>`},
services(){const list=S.cat==='Все'?SVCS:SVCS.filter(s=>s.cat===S.cat);
 return `<div><h1>Услуги</h1><p class="lead">${SVCS.length} услуг в пяти разделах. Рядом с каждой указан срок выполнения.</p></div>
 <div class="chips">${['Все',...CATS].map(c=>`<button data-cat="${c}" class="${S.cat===c?'on':''}">${c}</button>`).join('')}</div><div class="grid">${list.map(card).join('')}</div>`},
form(){const d=S.draft,s=svc(d.svc);
 const prof=`<div class="auto"><h3>Заполнено из профиля</h3>${[['ФИО',ME.name],['ID студента',ME.id],['Группа',ME.group],['Программа',ME.prog]].map(([a,b])=>`<div class="kv"><span>${a}</span><b>${esc(b)}</b></div>`).join('')}</div>`;
 const back=`<button class="back" data-${d.step===1?'go="services"':'step="1"'}>← ${d.step===1?'К услугам':'Изменить данные'}</button>`;
 const head=`<div><h1>${esc(s.n)}</h1><p class="lead">Срок выполнения: ${esc(s.sla)}.</p></div>`;
 if(d.step===1)return `${back}${head}<form class="panel" id="f" novalidate><div class="steps"><b>Шаг 1 из 2. Данные заявки</b></div>${prof}${s.f.map(x=>{const v=esc(d.v[x.k]||''),e=S.errs[x.k],id='f-'+x.k;
  const c=x.t==='select'?`<select id="${id}" data-f="${x.k}">${x.o.map(o=>`<option ${o===d.v[x.k]?'selected':''}>${esc(o)}</option>`).join('')}</select>`:x.t==='area'?`<textarea id="${id}" data-f="${x.k}" placeholder="${esc(x.p)}">${v}</textarea>`:`<input id="${id}" data-f="${x.k}" placeholder="${esc(x.p)}" value="${v}">`;
  return `<div class="field ${e?'bad':''}"><label for="${id}">${esc(x.l)}</label>${c}${e?`<span class="err">${esc(e)}</span>`:''}</div>`}).join('')}<div class="row"><button class="btn" type="submit">Проверить заявку</button></div></form>`;
 return `${back}${head}<div class="panel"><div class="steps"><b>Шаг 2 из 2. Проверьте и отправьте</b></div><dl class="review" style="margin:0">${[['Заявитель',ME.name+', '+ME.group],...s.f.map(x=>[x.l,d.v[x.k]])].map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl><div class="row"><button class="btn" data-submit>Отправить заявку</button></div></div>`},
requests(){const l=mine();return `<div><h1>Мои заявки</h1><p class="lead">Статус каждой заявки виден от подачи до готового результата.</p></div><div class="sec">${l.length?l.map(ticket).join(''):'<p class="empty">Заявок пока нет.</p>'}</div>`},
detail(){const r=find(S.arg),s=svc(r.svc),staff=S.role==='staff';
 return `<button class="back" data-go="${staff?'queue':'requests'}">← ${staff?'К очереди':'Мои заявки'}</button>
 <div><span class="num">${r.id}</span><h1>${esc(s.n)}</h1></div>
 ${r.ret?`<div class="banner b-warn"><b>Заявку вернули на исправление.</b> ${esc(r.ret)}</div>`:''}
 ${r.stage===3?'<div class="banner b-good"><b>Заявка выполнена.</b> '+(s.doc?'Документ готов и подписан электронной подписью.':'Результат передан заявителю.')+'</div>':''}
 <div class="panel"><div>${pill(r)}</div>${tracker(r)}<dl class="review" style="margin:0">${[['Заявитель',r.who.name+', '+r.who.group],['Срок',s.sla],...Object.entries(r.data)].map(([a,b])=>`<div><dt>${esc(a)}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl>
 <div class="row">${staff?staffBtns(r):studentBtns(r,s)}</div></div>`},
doc(){const r=find(S.arg),s=svc(r.svc),when=r.log[3]||new Date();const lang=r.data['Язык документа'];const to=r.data['Куда предоставить'];
 const body=r.svc==='study'?`Настоящая справка подтверждает, что <b>${esc(r.who.name)}</b> (ID ${r.who.id}) обучается на 2 курсе образовательной программы «${esc(ME.prog)}», группа ${esc(r.who.group)}, очная форма обучения. Справка выдана для предоставления: ${esc(to||'по месту требования').toLowerCase()}.`:`Настоящий транскрипт подтверждает результаты обучения <b>${esc(r.who.name)}</b> (ID ${r.who.id}), программа «${esc(ME.prog)}», группа ${esc(r.who.group)}, на дату выдачи. Средний балл GPA: 3.42.`;
 return `<button class="back" data-go="detail" data-arg="${r.id}">← К заявке</button>
 <article class="paper"><header><span>Демонстрационный университет</span><span>Офис регистратора</span><h2>${esc(s.n)}</h2><span style="font-family:var(--mono)">№ ${r.id} от ${day(when)}${lang?' · '+esc(lang):''}</span></header><p>${body}</p>
 <div class="foot"><div><div class="qr">${qr(r.id)}</div><div class="qrcap">Проверка подлинности: номер ${r.id}</div></div><div class="stamp">Подписано ЭЦП<br>Офис регистратора<br>(демо)</div></div></article>
 <div class="row" style="justify-content:center"><button class="btn" data-verify="${r.id}">Проверить подлинность</button><button class="btn alt" data-copy="${r.id}">Скопировать номер</button></div>`},
verify(){const v=S.verifyRes;return `<div><h1>Проверка документа</h1><p class="lead">Работодатель или банк вводит номер с документа и сразу видит, настоящий ли он. Вход в систему не нужен.</p></div>
 <form class="panel" id="vf" novalidate><div class="field"><label for="vi">Номер документа</label><div class="inline"><input id="vi" placeholder="ZV-0031" value="${esc(S.verifyInput)}"><button class="btn" type="submit">Проверить</button></div></div>
 ${v?v.ok?`<div class="banner b-good"><b>Документ действителен.</b></div><dl class="review" style="margin:0">${[['Документ',svc(v.r.svc).n],['Владелец',v.r.who.name],['Номер',v.r.id],['Дата выдачи',day(v.r.log[3])],['Подписант','Офис регистратора']].map(([a,b])=>`<div><dt>${a}</dt><dd>${esc(b)}</dd></div>`).join('')}</dl>`:`<div class="banner b-warn"><b>Документ не найден.</b> Проверьте номер: он указан в шапке документа и выглядит как ZV-0031.</div>`:''}</form>`},
queue(){const open=S.reqs.filter(r=>r.stage<3&&!r.ret),done=S.reqs.filter(r=>r.stage===3);
 return `<div><h1>Очередь заявок</h1><p class="lead">Рабочее место сотрудника. Все заявки студентов собраны в одном списке.</p></div>
 <div class="stats"><div class="stat"><b>${S.reqs.filter(r=>r.stage===0&&!r.ret).length}</b><span>Новые</span></div><div class="stat"><b>${S.reqs.filter(r=>r.stage===1&&!r.ret).length}</b><span>В работе</span></div><div class="stat"><b>${done.length}</b><span>Выполнено</span></div></div>
 <section class="sec">${open.length?open.map(r=>`<div class="ticket"><div><span class="num">${r.id} · ${esc(r.who.name)}, ${esc(r.who.group)}</span><h3>${esc(svc(r.svc).n)}</h3></div>${pill(r)}<div class="row full">${staffBtns(r)}<button class="btn alt" data-go="detail" data-arg="${r.id}">Открыть</button></div></div>`).join(''):'<p class="empty">Новых заявок нет.</p>'}</section>`}
};
function staffBtns(r){if(r.ret||r.stage===3)return '<span class="muted">Действий не требуется</span>';
 return `${r.stage===0?`<button class="btn" data-act="take" data-id="${r.id}">Взять в работу</button>`:`<button class="btn" data-act="sign" data-id="${r.id}">Подписать и выдать</button>`}<button class="btn alt" data-act="back" data-id="${r.id}">Вернуть на исправление</button>`}
function studentBtns(r,s){if(r.ret)return `<button class="btn" data-act="resend" data-id="${r.id}">Исправить и отправить снова</button>`;
 if(r.stage===3&&s.doc)return `<button class="btn" data-go="doc" data-arg="${r.id}">Открыть документ</button>`;return ''}
function qr(t){try{const q=qrcode(0,'M');q.addData('TEREZE-DEMO VERIFY '+t);q.make();return q.createSvgTag({cellSize:3,margin:0,scalable:true})}catch(e){return '<div style="padding:12px;font-size:11px;color:#333">QR-код не загрузился. Проверка по номеру работает.</div>'}}

function shell(){const st=S.role==='student';
 const items=st?[['home','Главная','home'],['services','Услуги','grid'],['requests','Заявки','list'],['verify','Проверка','check']]:[['queue','Очередь','list'],['verify','Проверка','check']];
 const activeOf={form:'services',detail:st?'requests':'queue',doc:'requests'};const on=activeOf[S.view]||S.view;
 return `<div class="shell"><aside class="rail"><div class="brand"><div class="mark"><i></i><i></i><i></i><i></i></div><div><b>Терезе</b><small>единое окно студента</small></div></div>
 <nav class="nav" aria-label="Разделы">${items.map(([v,l,i])=>`<button data-go="${v}" class="${on===v?'on':''}" ${on===v?'aria-current="page"':''}>${svg(i)}<span>${l}</span>${v==='queue'&&qCount()?`<span class="count">${qCount()}</span>`:''}</button>`).join('')}</nav>
 <div class="who">${st?`<b>${esc(ME.name)}</b><span>${ME.group} · ${ME.year}</span>`:'<b>Офис регистратора</b><span>Сотрудник</span>'}</div></aside>
 <main class="main"><div class="wrap"><div class="top"><p class="note">Учебный прототип. Все данные вымышлены.</p>
 <div class="seg" role="group" aria-label="Роль в демонстрации"><button data-role="student" class="${st?'on':''}">Студент</button><button data-role="staff" class="${st?'':'on'}">Сотрудник</button></div>
 ${st?`<div class="popwrap"><button class="bell" data-bell aria-label="Уведомления">${svg('bell')}${unread()?`<em>${unread()}</em>`:''}</button>${S.pop?`<div class="pop"><h3>Уведомления</h3>${S.notes.length?S.notes.map(n=>`<button data-go="detail" data-arg="${n.id}">${esc(n.t)}<time>${n.id} · ${fmt(n.at)}</time></button>`).join(''):'<p>Уведомлений нет.</p>'}</div>`:''}</div>`:''}
 </div><div class="wrap view" style="padding:0">${V[S.view]()}</div></div></main></div>`}
const app=document.getElementById('app');
function render(top){app.innerHTML=shell();if(top)window.scrollTo(0,0)}
function go(v,arg){S.view=v;S.arg=arg||null;S.pop=false;S.errs={};render(true)}
let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.hidden=false;clearTimeout(tt);tt=setTimeout(()=>t.hidden=true,3200)}
function notify(r,t){if(r.who===ME)S.notes.unshift({t,at:new Date(),id:r.id,read:false})}
function start(id){const s=svc(id),v={};s.f.forEach(x=>v[x.k]=x.t==='select'?x.o[0]:'');S.draft={svc:id,step:1,v};S.q='';go('form')}
function runVerify(){const id=S.verifyInput.trim().toUpperCase();const r=find(id);S.verifyRes=(r&&r.stage===3&&svc(r.svc).doc)?{ok:true,r}:{ok:false}}

document.addEventListener('click',e=>{const b=e.target.closest('button');
 if(!b){if(S.pop){S.pop=false;render()}return}
 const d=b.dataset;
 if('bell'in d){S.pop=!S.pop;if(S.pop)setTimeout(()=>{S.notes.forEach(n=>n.read=true)},0);render();return}
 if(d.role){S.role=d.role;S.verifyRes=null;go(d.role==='student'?'home':'queue');return}
 if(d.start){start(d.start);return}
 if(d.cat){S.cat=d.cat;render();return}
 if(d.step){S.draft.step=1;render(true);return}
 if(d.verify){S.verifyInput=d.verify;runVerify();go('verify');return}
 if(d.copy){const done=()=>toast('Номер скопирован');const p=navigator.clipboard&&navigator.clipboard.writeText(d.copy);if(p)p.then(done).catch(()=>toast('Номер документа: '+d.copy));else toast('Номер документа: '+d.copy);return}
 if('submit'in d){const s=svc(S.draft.svc),data={};s.f.forEach(x=>data[x.l]=S.draft.v[x.k]);const id='ZV-'+String(S.seq++).padStart(4,'0');
  S.reqs.unshift({id,svc:s.id,who:ME,data,stage:0,log:[new Date(),null,null,null]});S.draft=null;go('detail',id);toast('Заявка '+id+' отправлена');return}
 if(d.act){const r=find(d.id),n=svc(r.svc).n;
  if(d.act==='take'){r.stage=1;r.log[1]=new Date();notify(r,n+': заявка в работе');toast('Заявка взята в работу')}
  if(d.act==='sign'){r.stage=3;r.log[2]=new Date();r.log[3]=new Date();notify(r,n+': готово');toast('Подписано. Студент получил уведомление')}
  if(d.act==='back'){r.ret='Уточните данные и отправьте заявку ещё раз.';notify(r,n+': нужно исправить');toast('Заявка возвращена студенту')}
  if(d.act==='resend'){r.ret=null;r.stage=0;r.log=[new Date(),null,null,null];toast('Заявка отправлена снова')}
  render();return}
 if(d.go){go(d.go,d.arg);return}
});
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='q'){S.q=t.value;document.getElementById('res').innerHTML=searchRes()}
 if(t.dataset.f&&S.draft)S.draft.v[t.dataset.f]=t.value;
 if(t.id==='vi')S.verifyInput=t.value;
});
document.addEventListener('submit',e=>{e.preventDefault();
 if(e.target.id==='f'){const s=svc(S.draft.svc),er={};s.f.forEach(x=>{if(!String(S.draft.v[x.k]).trim())er[x.k]='Заполните поле «'+x.l+'»'});S.errs=er;if(Object.keys(er).length){render();return}S.draft.step=2;render(true)}
 if(e.target.id==='vf'){runVerify();render()}
});
render();
</script>
</body></html>
